project: cairn-workspace
# Cost caps are opt-in. With none set, Cairn just tracks session cost.
# Set one from the dashboard (Home > Session cost > Set cost cap), or here, e.g.:
#   budgets:
#     project: { usd: 40, exhaustion_mode: wind_down }
#     daily:   { usd: 10 }
budgets: {}
routing:
  default: smart
  on_budget_80: fast_at_task_boundary
  on_budget_100: wind_down_then_block
aliases:
  smart: google/gemini-4-argon
  fast: google/gemini-3.8-flash
  local: ollama/qwen2.5-coder:14b
actions:
  allow:
    - read_file
    - list_dir
    - grep_search
    - run_tests
  ask:
    - write_file
    - edit_file
    - git_push
    - install_package
    - bash
  deny:
    - rm_rf_root
    - drop_database
    - git_push_force_main
remote:
  enabled: true
  require_biometric_for_high_risk: true
  session_timeout_minutes: 120
